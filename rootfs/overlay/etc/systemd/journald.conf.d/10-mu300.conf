[Journal]
# The journal was the main eMMC writer (~4 MB/min: syncs every 10 s plus Wi-Fi chip chatter). Sync every 2 min;
# kernel panics are still captured by pstore (ramoops), which systemd-pstore saves on the next boot.
SyncIntervalSec=2min
# The vendor kernel logs thousands of info lines per minute (thermal/core control, Wi-Fi chip keepalive). Do not
# store the kernel log directly; mu300-kmsg.service forwards warnings and worse (full log: dmesg).
ReadKMsg=no
# keep journald's memory and disk footprint small on a 1.4 GiB device
RuntimeMaxUse=16M
SystemMaxUse=32M
