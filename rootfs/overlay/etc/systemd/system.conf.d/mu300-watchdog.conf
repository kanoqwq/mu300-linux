# The reboot watchdog guards the last seconds of a shutdown. systemd's default is 10 minutes, which the UMP9620 PMIC
# watchdog of the mainline kernel rejects (its maximum is 300 s: "Failed to set timeout to 10min: Invalid
# argument"), so a reboot that hung was left to whatever the watchdog had been set to before. A clean shutdown takes
# about 45 s here.
[Manager]
RebootWatchdogSec=2min
