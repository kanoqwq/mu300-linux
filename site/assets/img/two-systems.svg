<text x="44" y="104" font-size="19" text-anchor="start" font-weight="700" class="t-an">Android's partitions</text>
<text x="44" y="132" font-size="16" text-anchor="start" class="t-muted">system, apps, your data</text>
<text x="458" y="104" font-size="19" text-anchor="start" font-weight="700" class="t-lx">Free space, about 32 GiB</text>
<text x="458" y="132" font-size="16" text-anchor="start" class="t-muted">Ubuntu and/or OpenWrt</text>
<path d="M 229 162 v 18" class="an-stroke" stroke-width="2"/>
<text x="229" y="202" font-size="16" text-anchor="middle" font-weight="700" class="t-an">left as they are</text>
<path d="M 685 162 v 18" class="lx-stroke" stroke-width="2"/>
<text x="685" y="202" font-size="16" text-anchor="middle" font-weight="700" class="t-lx">Linux lives here</text>
<text x="24" y="262" font-size="20" text-anchor="start" font-weight="700">Two boot slots: two front doors into the same house</text>
<rect x="24" y="284" width="300" height="118" rx="16" class="paper an-stroke" stroke-width="3" fill-opacity="1"/>
<rect x="54" y="304" width="56" height="78" rx="8" class="an"/><circle cx="98" cy="346" r="4" class="paper"/>
<text x="134" y="334" font-size="19" text-anchor="start" font-weight="700">Android's slot</text>
<text x="134" y="362" font-size="16" text-anchor="start" class="t-muted">never written</text>
<rect x="344" y="284" width="300" height="118" rx="16" class="paper lx-stroke" stroke-width="3" fill-opacity="1"/>
<rect x="374" y="304" width="56" height="78" rx="8" class="lx"/><circle cx="418" cy="346" r="4" class="paper"/>
<text x="454" y="334" font-size="19" text-anchor="start" font-weight="700">The other slot</text>
<text x="454" y="362" font-size="16" text-anchor="start" class="t-muted">Linux's boot image</text>
<path d="M 702 292 h 46 l 18 18 v 68 a 6 6 0 0 1 -6 6 h -58 a 6 6 0 0 1 -6 -6 v -80 a 6 6 0 0 1 6 -6 z" class="bl-soft bl-stroke" stroke-width="3"/>
<rect x="710" y="302" width="7" height="16" rx="2" class="bl"/>
<rect x="722" y="302" width="7" height="16" rx="2" class="bl"/>
<rect x="734" y="302" width="7" height="16" rx="2" class="bl"/>
<rect x="746" y="302" width="7" height="16" rx="2" class="bl"/>
<text x="780" y="326" font-size="16" text-anchor="start" class="t-bl">F50: Linux can live</text>
<text x="780" y="346.8" font-size="16" text-anchor="start" class="t-bl">on an SD card instead</text>
</svg>
