<svg xmlns="http://www.w3.org/2000/svg" class="mu-dg" viewBox="0 0 960 440" width="960" height="440" role="img" aria-labelledby="two-en-t two-en-d" xml:lang="en">
<title id="two-en-t">Android and Linux on one device</title>
<desc id="two-en-d">The internal storage: Android's partitions stay as they are, and Linux goes into the free space after them. The device has two boot slots; Android keeps its own, and Linux's boot image goes into the other one.</desc>
