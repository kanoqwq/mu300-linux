# Docker's package turns bridge firewalling on (12-br-netfilter-ip.conf): with br_netfilter loaded, every frame
# bridged in br-lan (Wi-Fi and USB clients talking to each other) would go through fw4. Docker's nftables backend
# does not need it (docs/FINDINGS.md 130).
net.bridge.bridge-nf-call-arptables=0
net.bridge.bridge-nf-call-ip6tables=0
net.bridge.bridge-nf-call-iptables=0
